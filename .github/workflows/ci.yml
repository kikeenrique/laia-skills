name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate skills
        run: ruby tools/scripts/validate_skills.rb

  laiaskills:
    # Linux on purpose: the tool must run on Linux as well as macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.1"
      - uses: actions/cache@v5
        with:
          path: tools/laiaskills/.build
          key: ${{ runner.os }}-laiaskills-${{ hashFiles('tools/laiaskills/Package.resolved') }}
          restore-keys: ${{ runner.os }}-laiaskills-
      - name: Build
        run: swift build --package-path tools/laiaskills
      - name: Test
        run: swift test --package-path tools/laiaskills
