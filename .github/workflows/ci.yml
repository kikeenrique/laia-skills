name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-skills:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate skills
        run: ruby tools/scripts/validate_skills.rb

  laiaskills:
    # Linux on purpose: the tool must run on Linux as well as macOS.
    runs-on: ubuntu-26.04
    env:
      SWIFT_VERSION: "6.4"
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - uses: actions/cache@v5
        with:
          path: tools/laiaskills/.build
          # Image and Swift version are part of the key: a build folder from another compiler breaks the build.
          key: ubuntu-26.04-swift${{ env.SWIFT_VERSION }}-laiaskills-${{ hashFiles('tools/laiaskills/Package.resolved') }}
          restore-keys: ubuntu-26.04-swift${{ env.SWIFT_VERSION }}-laiaskills-
      - name: Build
        run: swift build --package-path tools/laiaskills
      - name: Test
        run: swift test --package-path tools/laiaskills
