[tasks.validate]
description = "Validate first-party skills, the marketplace, and the laiaskills configs"
run = "ruby tools/scripts/validate_skills.rb"

[tasks.laiaskills]
description = "Run the laiaskills CLI, e.g. `mise run laiaskills check`"
run = "swift run --quiet --package-path tools/laiaskills laiaskills"

[tasks."xcode-skills:snapshot"]
description = "Snapshot the selected Xcode's agent skills into third-party/kikeenrique__xcode-skills (`-- --release` tags a final release; never pushes)"
run = "bash tools/scripts/snapshot_xcode_skills.sh"

[tasks."laiaskills:build"]
description = "Build laiaskills"
run = "swift build --package-path tools/laiaskills"

[tasks."laiaskills:test"]
description = "Run the laiaskills tests on this machine"
run = "swift test --package-path tools/laiaskills"

[tasks."laiaskills:test-linux"]
description = "Run the laiaskills tests in the swift:6.4 Ubuntu 26.04 image, like CI (needs docker, podman, or Apple container)"
run = '''
runtime=$(command -v docker || command -v podman || command -v container) \
  || { echo "Install docker, podman, or Apple container first." >&2; exit 1; }
# Apple container gives each container its own VM, 1 GiB by default: too little to build the package.
case "$(basename "$runtime")" in
  container) resources="--memory 8g --cpus 4" ;;
  *) resources="" ;;
esac
# The CLI tests run .build/debug/laiaskills by default, which is the host's macOS build when there is one.
"$runtime" run --rm $resources --volume "$MISE_PROJECT_ROOT:/repo" --workdir /repo \
  --env LAIASKILLS_BINARY=/repo/tools/laiaskills/.build/linux/debug/laiaskills swift:6.4.0-resolute \
  bash -c "apt-get update -qq && apt-get install -y -qq ruby curl >/dev/null \
    && git config --global --add safe.directory '*' && swift test --package-path tools/laiaskills --build-path tools/laiaskills/.build/linux"
'''
